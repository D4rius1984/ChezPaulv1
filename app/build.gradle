plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Charger les propriétés du keystore
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.chezpaul'
    compileSdk 34

    defaultConfig {
        applicationId "com.chezpaul"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.4"
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: 'placeholder')
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: ''
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.11' // Compatible avec Kotlin 1.9.23 / Compose 2024.04.00
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // Core dependencies
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.activity:activity-compose:1.9.0"

    // Compose BOM (version compatible avec Compose 2024)
    implementation platform('androidx.compose:compose-bom:2024.04.00')

    // Compose modules
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.ui:ui-text"
    implementation "androidx.compose.material3:material3:1.1.0" // Mise à jour vers Material3
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.navigation:navigation-compose"
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.foundation:foundation-layout"
    implementation "androidx.navigation:navigation-compose:2.7.7"

    // Google Material (thème classique Android)
    implementation "com.google.android.material:material:1.7.0"

    // ViewModel for Compose - Lifecycle integration
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"  // Ajout pour collectAsStateWithLifecycle

    // Debug dependencies
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
